name: chat_app
description: Privacy-first chat with an integrated P2P wallet.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  agora_rtc_engine: ^6.6.4
  cached_network_image: ^4.0.7
  connectivity_plus: ^7.3.2
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  record: ^7.2.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  # 2.12.2+ is a Swift rewrite that calls AVFoundation's load(_:isolation:),
  # which the Xcode on the CI macOS runner doesn't have ("Extra argument
  # 'isolation' in call"). 2.12.1 is the last Objective-C release and supports
  # Flutter 3.47. Remove once CI builds with a newer Xcode.
  video_player_avfoundation: 2.12.1
