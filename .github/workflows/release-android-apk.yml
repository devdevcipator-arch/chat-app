name: Release Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/release-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: release-android-apk
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the version the project is built and tested with locally.
          # Newer Flutter releases can raise the minimum Android Gradle Plugin
          # version and break the build; bump this together with AGP.
          flutter-version: 3.47.9
          cache: true

      - name: Write env.json from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets are required."
            exit 1
          fi
          # API_BASE_URL falls back to the app's built-in default when unset.
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            --arg api "${API_BASE_URL:-https://chat.devcipator.com}" \
            --arg r2 "$R2_PUBLIC_BASE" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, API_BASE_URL: $api, R2_PUBLIC_BASE: $r2}' \
            > env.json

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed APK."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/chat-app.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chat App v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: chat-app.apk
          body: |
            Android build #${{ github.run_number }} from ${{ github.sha }}.

            Permanent download link (always the newest build):
            https://github.com/${{ github.repository }}/releases/latest/download/chat-app.apk

            The unsigned iOS build (chat-app.ipa) is attached by the iOS workflow when it finishes:
            https://github.com/${{ github.repository }}/releases/latest/download/chat-app.ipa

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties env.json
