name: Release Android APK

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/release-android-apk.yml"
  # Manual runs on any branch build and upload the APKs as an artifact;
  # only main publishes a GitHub Release.
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: release-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # app.config.ts → versionCode; plugins/withAndroidRelease.js makes it
      # 2000 + N (arm64) / 1000 + N (armeabi-v7a), the same scheme as the
      # Flutter builds, so each APK installs as an update over the last.
      BUILD_NUMBER: ${{ github.run_number }}
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.config.ts', 'mobile/plugins/**') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Write .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets are required."
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "EXPO_PUBLIC_API_BASE_URL=${API_BASE_URL:-https://chat.devcipator.com}"
            echo "EXPO_PUBLIC_R2_PUBLIC_BASE=$R2_PUBLIC_BASE"
          } > .env

      # Optional: push notifications / lock-screen call ringing are compiled in
      # only when this secret holds the Firebase google-services.json.
      - name: Write google-services.json (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "Push notifications: enabled"
          else
            echo "Push notifications: not configured (no GOOGLE_SERVICES_JSON secret)"
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Upload resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-${{ github.run_number }}
          path: mobile/package-lock.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate native Android project (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to build a debug-signed APK."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      # Hermes + New Architecture, R8 minify + resource shrinking, one APK per ABI.
      - name: Build release APKs (split per ABI)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # chat-app.apk is the 64-bit ARM build (virtually every phone in use);
      # chat-app-32bit.apk is for older 32-bit-only devices.
      - name: Rename APKs
        run: |
          out=android/app/build/outputs/apk/release
          ls -lh "$out"
          cp "$out/app-arm64-v8a-release.apk" "$GITHUB_WORKSPACE/chat-app.apk"
          cp "$out/app-armeabi-v7a-release.apk" "$GITHUB_WORKSPACE/chat-app-32bit.apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in "$GITHUB_WORKSPACE"/chat-app*.apk; do
            "$tools/aapt2" dump badging "$apk" | head -1
            # Same certificate as previous releases = installs as an update.
            "$tools/apksigner" verify --print-certs "$apk" | grep -i "SHA-256 digest"
          done
          ls -lh "$GITHUB_WORKSPACE"/chat-app*.apk

      - name: Upload APKs (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-apks-${{ github.run_number }}
          path: |
            chat-app.apk
            chat-app-32bit.apk
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chat App v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            chat-app.apk
            chat-app-32bit.apk
          body: |
            Android build #${{ github.run_number }} from ${{ github.sha }}.

            Permanent download link (always the newest build, 64-bit ARM):
            https://github.com/${{ github.repository }}/releases/latest/download/chat-app.apk

            Older 32-bit Android phones:
            https://github.com/${{ github.repository }}/releases/latest/download/chat-app-32bit.apk

            The unsigned iOS build (chat-app.ipa) is attached by the iOS workflow when it finishes:
            https://github.com/${{ github.repository }}/releases/latest/download/chat-app.ipa

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties .env google-services.json
