name: Release iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/release-ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write # upload release assets

concurrency:
  group: release-ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    # Intel image: the arm64 macOS pool (macos-latest) has been too congested
    # to pick up jobs. macos-13 is retired; macos-15-intel is the Intel option.
    runs-on: macos-15-intel
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Write .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets are required."
            exit 1
          fi
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "EXPO_PUBLIC_API_BASE_URL=${API_BASE_URL:-https://chat.devcipator.com}"
            echo "EXPO_PUBLIC_R2_PUBLIC_BASE=$R2_PUBLIC_BASE"
          } > .env

      - name: Write GoogleService-Info.plist (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist; fi

      # Select the newest Xcode installed on the runner.
      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1#' | sort -V | tail -1)
          echo "Selecting Xcode $newest"
          sudo xcode-select -s "/Applications/Xcode_${newest}.app"
          xcodebuild -version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Type-check
        run: npx tsc --noEmit

      # Generates ios/ and runs `pod install` from a clean sandbox.
      - name: Generate native iOS project (expo prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS app (unsigned)
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -50
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"

      - name: Package chat-app.ipa
        run: |
          app=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/chat-app.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/chat-app.ipa"

      - name: Upload IPA (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: chat-app-ipa-${{ github.run_number }}
          path: chat-app.ipa
          retention-days: 14

      # The Android workflow creates the release for this commit (its tag uses
      # its own run number). Attach the IPA to that same release so the APK
      # and IPA ship together; wait for it if Android is still building.
      - name: Find release for this commit
        if: github.ref == 'refs/heads/main'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=""
          for attempt in $(seq 1 60); do
            tag=$(gh api "repos/${{ github.repository }}/releases?per_page=30" \
              --jq '[.[] | select(.target_commitish == "${{ github.sha }}" and .draft == false)][0].tag_name // empty')
            [ -n "$tag" ] && break
            echo "No release for ${{ github.sha }} yet (attempt $attempt/60); waiting 30s…"
            sleep 30
          done
          if [ -z "$tag" ]; then
            tag=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name // empty' || true)
            echo "::warning::No release for this commit; attaching the IPA to the latest release ($tag)."
          fi
          if [ -z "$tag" ]; then
            echo "::error::No GitHub Release exists to attach the IPA to."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload IPA to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          make_latest: true
          files: chat-app.ipa

      - name: Clean up
        if: always()
        run: rm -f .env GoogleService-Info.plist
